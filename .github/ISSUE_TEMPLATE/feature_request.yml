name: Feature request
description: Suggest a new platform, output format, check or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type of request
      options:
        - New platform / vendor
        - New output format (for example Terraform, API call)
        - New check or warning
        - PDF parameter sheet
        - User interface
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What do you need to do that the tool does not support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested solution
      description: How it could work. For a new platform, include where its IPsec settings are documented.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots or examples, with keys and real addresses removed.
